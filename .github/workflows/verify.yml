name: Verify reconciliation
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: '0.12.23'
      - run: uv sync --locked
      - run: uv run ruff check src tests scripts browser_checks
      - run: uv run ruff format --check src tests scripts browser_checks
      - run: uv run pytest -q --junitxml=test-results/unit.xml
      - run: uv build
      - name: Install and exercise the built wheel outside the checkout
        shell: bash
        run: |
          uv export --frozen --no-dev --no-emit-project --output-file test-results/wheel-constraints.txt
          uv venv test-results/wheel-env
          if [ "$RUNNER_OS" = Windows ]; then
            PY=test-results/wheel-env/Scripts/python.exe
          else
            PY=test-results/wheel-env/bin/python
          fi
          uv pip install --python "$PY" -c test-results/wheel-constraints.txt dist/*.whl
          ROOT="$PWD"
          mkdir -p "$RUNNER_TEMP/recon-wheel-run"
          cd "$RUNNER_TEMP/recon-wheel-run"
          set +e
          "$ROOT/$PY" -m reconproof.cli run --left "$ROOT/examples/ledger.csv" --right "$ROOT/examples/target.xlsx" --rules "$ROOT/examples/rules.json" --out "$ROOT/test-results/installed-wheel"
          result=$?
          set -e
          test "$result" -eq 2
          "$ROOT/$PY" -m reconproof.cli verify "$ROOT/test-results/installed-wheel"
          test -s "$ROOT/test-results/installed-wheel/report.html"
      - name: Install Chromium
        if: runner.os == 'Linux'
        run: uv run playwright install --with-deps chromium
      - name: Browser acceptance and real demonstration recording
        if: runner.os == 'Linux'
        run: uv run pytest browser_checks -q --junitxml=test-results/browser.xml
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: evidence-${{ runner.os }}
          path: |
            test-results/unit.xml
            test-results/browser.xml
            test-results/installed-wheel/
            test-results/browser/
            dist/
          retention-days: 14
