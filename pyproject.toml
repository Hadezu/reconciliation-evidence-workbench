[project]
name = "reconciliation-evidence-workbench"
version = "0.1.0"
description = "Offline, row-preserving CSV/XLSX reconciliation with inspectable SQL and evidence exports"
requires-python = ">=3.12,<3.15"
dependencies = ["duckdb>=1.4,<2", "openpyxl>=3.1.5,<4", "defusedxml>=0.7.1,<1", "pydantic>=2.10,<3"]

[project.scripts]
recon = "reconproof.cli:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "hypothesis>=6,<7",
    "ruff>=0.12,<1",
    "playwright>=1.50,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reconproof"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
